name: tests

on:
  # Pull requests run on every event; pushes only on main, so a PR branch isn't tested twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install "ruff>=0.6,<1"
          ruff check src tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scripts parse (node --check)
        run: |
          set -e
          files=$(find src/controller_inbox/static -name '*.js' | sort)
          test -n "$files"
          for f in $files; do
            node --check "$f"
          done

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          # The oldest Python CloseDesk supports (pyproject's requires-python), so code it can't run is caught here.
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,ocr,tables]"
      - name: Test
        # The browser tests run in their own job below.
        run: pytest -q -m "not browser"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install -e ".[dev,ocr,tables,browser]"
          python -m playwright install --with-deps chromium
      - name: Test
        run: pytest -q -m browser
