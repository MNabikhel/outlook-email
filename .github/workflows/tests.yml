name: tests

on:
  # Pull requests run on every event; pushes only on main, so a PR branch isn't tested twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install "ruff>=0.6,<1"
          ruff check src tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scripts parse (node --check)
        run: |
          set -e
          files=$(find src/controller_inbox/static -name '*.js' | sort)
          test -n "$files"
          for f in $files; do
            node --check "$f"
          done
      - name: Launchers parse (bash -n)
        run: bash -n CloseDesk.command CloseDesk-Update.command scripts/install.sh scripts/overnight.sh

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          # The oldest Python CloseDesk supports (pyproject's requires-python), so code it can't run is caught here.
          - os: ubuntu-latest
            python: "3.11"
          # Newer Pythons, so one a computer was updated to doesn't break CloseDesk. (The OCR add-on isn't built
          # for them yet; its tests skip.)
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    # Windows' and macOS's runners take about 20 minutes for the suite; the limit leaves room for a slow runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,ocr,tables]"
      - name: Test
        # The browser tests run in their own job below.
        run: pytest -q -m "not browser" --durations=25

  # The launchers themselves, run as a person runs them: set-up from nothing, a second start, a renamed folder,
  # the dashboard answering, an update. Once with the machine's Python (nothing may be downloaded), once with
  # --get-python.
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        own_python: ["", "1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Launcher smoke test
        env:
          CLOSEDESK_OWN_PYTHON: ${{ matrix.own_python }}
        run: python tests/launcher_smoke.py

  # The CloseDesk window itself (launch.py --app, what the CloseDesk shortcut runs), opened for real: set up by the
  # launcher, the shortcut made and read back, then the window opened as the shortcut starts it, onto a CloseDesk
  # already open, and through the shortcut itself as a double-click opens it. Each time CloseDesk's page has to load in
  # it, the window closes itself, and CloseDesk stops with it. On a Mac the Dock has to call it CloseDesk (lsappinfo),
  # not Python. On Linux there is no window, and its start has to say so. Screenshots and the app's log are kept.
  window:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        own_python: ["", "1"]
        include:
          - os: ubuntu-latest
            own_python: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Microsoft Edge WebView2 Runtime
        # The window needs it, and GitHub's Windows Server has none (CloseDesk would open in the browser there).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $found = ''
          foreach ($key in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                           'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}') {
            $pv = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
            if ($pv -and $pv -ne '0.0.0.0') { $found = $pv }
          }
          if ($found) {
            "WebView2 Runtime $found is on this computer"
          } else {
            "No WebView2 Runtime on this computer: installing it"
            choco install webview2-runtime --ignore-checksums -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: The CloseDesk window
        env:
          CLOSEDESK_OWN_PYTHON: ${{ matrix.own_python }}
          CLOSEDESK_SMOKE_SHOTS: ${{ runner.temp }}/closedesk-window
        run: python tests/launcher_smoke.py --window
      - name: Keep the screenshots and the app's log
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: window-${{ matrix.os }}${{ matrix.own_python && '-own-python' || '' }}
          path: ${{ runner.temp }}/closedesk-window
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install -e ".[dev,ocr,tables,browser]"
          python -m playwright install --with-deps chromium
      - name: Test
        run: pytest -q -m browser
