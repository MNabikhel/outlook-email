[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controller-inbox"
version = "0.1.0"
description = "Local inbox assistant: classify Outlook mail and attachments, flag what needs action, and keep a daily action list."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CloseDesk" }]
dependencies = [
  "httpx>=0.27,<1",
  "msal>=1.28,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pypdf>=4.0,<7",
  "pdfminer.six>=20231228,<20280000",
  # Draws a PDF page as a picture for a model that can see (vision.py).
  "pypdfium2>=4.30,<6",
  "Pillow>=10,<13",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "xlrd>=2.0,<3",
  "extract-msg>=0.48,<1",
  "python-multipart>=0.0.9,<1",
  "python-dateutil>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "tzlocal>=5,<6",
  "tzdata>=2024.1; sys_platform == 'win32'",
  # Reads classic Outlook on this computer, read only (outlook_desktop.py).
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "aspose-email-foss>=26.3,<27"]
# Drives a real Chromium for the tests marked "browser" (pytest -m browser); then run: python -m playwright install chromium
browser = ["playwright>=1.45,<2"]
# Reads scanned PDFs and pictures on this computer. Not yet built for Python 3.13+, where Tesseract is used if installed.
ocr = [
  "rapidocr-onnxruntime>=1.4,<2; python_version < '3.13'",
  # rapidocr runs on these; named here so their versions are bounded too.
  "onnxruntime>=1.17,<2; python_version < '3.13'",
  "numpy>=1.24,<3; python_version < '3.13'",
]
# A second reader for the tables in a PDF's text (camelot_tables.py). Optional: without it, PDFs are read as before.
tables = ["camelot-py>=2.0,<3"]

[project.scripts]
controller-inbox = "controller_inbox.cli:main"
closedesk = "controller_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controller_inbox = ["templates/*", "static/*", "static/ui/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "browser: drives a real Chromium through Playwright (needs the browser extra); deselect with -m \"not browser\"",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Syntax errors and pyflakes: undefined names, unused imports and variables, redefinitions.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Uses the fixtures it imports from test_teach_and_preview by name, which pyflakes reads as redefinitions.
"tests/test_teach_edges.py" = ["F811"]
