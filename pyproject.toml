[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controller-inbox"
version = "0.1.0"
description = "Local inbox assistant: classify Outlook mail and attachments, flag what needs action, and keep a daily action list."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CloseDesk" }]
dependencies = [
  "httpx>=0.27",
  "msal>=1.28",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pypdf>=4.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "xlrd>=2.0",
  "extract-msg>=0.48",
  "python-multipart>=0.0.9",
  "python-dateutil>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
controller-inbox = "controller_inbox.cli:main"
closedesk = "controller_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controller_inbox = ["templates/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
