[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controller-inbox"
version = "0.1.0"
description = "Local inbox assistant: classify Outlook mail and attachments, flag what needs action, and keep a daily action list."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CloseDesk" }]
dependencies = [
  "httpx>=0.27,<1",
  "msal>=1.28,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pypdf>=4.0,<7",
  "pdfminer.six>=20231228",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "xlrd>=2.0,<3",
  "extract-msg>=0.48,<1",
  "python-multipart>=0.0.9,<1",
  "python-dateutil>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "tzlocal>=5,<6",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "aspose-email-foss>=26.3,<27"]
# Reads scanned PDFs and pictures on this computer. Not yet built for Python 3.13+, where Tesseract is used if installed.
ocr = ["rapidocr-onnxruntime>=1.4,<2; python_version < '3.13'"]

[project.scripts]
controller-inbox = "controller_inbox.cli:main"
closedesk = "controller_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controller_inbox = ["templates/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
